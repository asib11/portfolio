server {
    listen 80;
    listen [::]:80;
    server_name asibahmed.me www.asibahmed.me;

    server_tokens off;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name asibahmed.me www.asibahmed.me;

    ssl_certificate /etc/letsencrypt/live/asibahmed.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asibahmed.me/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    server_tokens off;

    location / {
        proxy_pass http://nextjs:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
