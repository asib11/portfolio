server {
    listen 80;
    listen [::]:80;
    server_name asibahmed.me www.asibahmed.me;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name asibahmed.me www.asibahmed.me;

    ssl_certificate /etc/letsencrypt/live/asibahmed.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asibahmed.me/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    server_tokens off;

    # Extended timeouts for the AI chat endpoint (CPU inference can take 60-120s)
    location /api/chat {
        proxy_pass http://nextjs:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout  10s;
        proxy_send_timeout     300s;
        proxy_read_timeout     300s;
        send_timeout           300s;
    }

    location / {
        proxy_pass http://nextjs:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
