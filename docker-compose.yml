services:
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextjs_portfolio
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
    networks:
      - default

  nginx:
    image: nginx:alpine
    container_name: nginx_portfolio
    restart: unless-stopped
    # ports:
    #   - "81:80"
    #   - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - nextjs
    networks:
      - default
      - global-proxy-net

networks:
  default:
    driver: bridge
  global-proxy-net:
    external: true
